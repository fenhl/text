[package]
name = "text"
version = "0.2.1"
edition = "2024"
rust-version = "1.95" # nixpkgs stable

[lints.rust]
rust_2018_idioms = "deny"
unsafe_code = "forbid"
unused = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
warnings = "deny"

[dependencies]
derive-where = "1"
fontdue = { version = "0.9", features = ["parallel"] }
itertools = "0.15"
noisy_float = "0.2"
nonempty-collections = "1"
thiserror = "2"
tiny-skia = { git = "https://github.com/fenhl/tiny-skia", branch = "softbuffer-zerocopy" }
